<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Puntea - Login</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .login-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background: linear-gradient(135deg, #2F5CED 0%, #1a3a99 100%);
        }
        
        .login-box {
            background: white;
            border-radius: 16px;
            padding: 40px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        
        .login-header {
            text-align: center;
            margin-bottom: 30px;
        }
        
        .login-header h1 {
            color: #2F5CED;
            margin: 0;
            font-size: 28px;
        }
        
        .login-header p {
            color: #666;
            margin: 10px 0 0 0;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 500;
        }
        
        .form-group input {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            box-sizing: border-box;
            transition: border-color 0.3s;
        }
        
        .form-group input:focus {
            outline: none;
            border-color: #2F5CED;
        }
        
        .btn-login {
            width: 100%;
            padding: 14px;
            background: #2F5CED;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s;
        }
        
        .btn-login:hover {
            background: #1a3a99;
        }
        
        .btn-login:disabled {
            background: #ccc;
            cursor: not-allowed;
        }
        
        .error-message {
            background: #fee;
            color: #c33;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            text-align: center;
            display: none;
        }
        
        .error-message.show {
            display: block;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-box">
            <div class="login-header">
                <h1>🎯 Puntea</h1>
                <p>Inicia sesión para continuar</p>
            </div>
            
            <div id="errorMsg" class="error-message"></div>
            
            <form id="loginForm">
                <div class="form-group">
                    <label for="email">Email</label>
                    <input 
                        type="email" 
                        id="email" 
                        name="email" 
                        placeholder="tu@email.com" 
                        required 
                        autocomplete="email"
                    >
                </div>
                
                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <input 
                        type="password" 
                        id="password" 
                        name="password" 
                        placeholder="••••••••" 
                        required 
                        autocomplete="current-password"
                    >
                </div>
                
                <button type="submit" class="btn-login" id="loginBtn">
                    Iniciar Sesión
                </button>
            </form>
        </div>
    </div>

    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    
    <script>
        // Tu configuración de Firebase (la misma que en index.html)
        const firebaseConfig = {
            apiKey: "AIzaSyDYOtOllYfyNMvQI-4xj_8Kn2IXsMw6Oik",
            authDomain: "puntea-805f1.firebaseapp.com",
            projectId: "puntea-805f1",
            storageBucket: "puntea-805f1.firebasestorage.app",
            messagingSenderId: "1072832380004",
            appId: "1:1072832380004:web:d50955d36f1ad9bb213371"
        };

        // Inicializar Firebase
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();

        // Verificar si ya está logueado
        auth.onAuthStateChanged((user) => {
            if (user) {
                // Si ya está logueado, ir al index
                window.location.href = 'index.html';
            }
        });

        // Manejar el formulario de login
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const loginBtn = document.getElementById('loginBtn');
            const errorMsg = document.getElementById('errorMsg');
            
            // Desactivar botón y mostrar loading
            loginBtn.disabled = true;
            loginBtn.textContent = 'Iniciando sesión...';
            errorMsg.classList.remove('show');
            
            try {
                await auth.signInWithEmailAndPassword(email, password);
                // El redirect se hace automáticamente con onAuthStateChanged
            } catch (error) {
                console.error('Error de login:', error);
                
                let message = 'Error al iniciar sesión';
                
                switch (error.code) {
                    case 'auth/user-not-found':
                        message = 'Usuario no encontrado';
                        break;
                    case 'auth/wrong-password':
                        message = 'Contraseña incorrecta';
                        break;
                    case 'auth/invalid-email':
                        message = 'Email inválido';
                        break;
                    case 'auth/too-many-requests':
                        message = 'Demasiados intentos. Intenta más tarde';
                        break;
                }
                
                errorMsg.textContent = message;
                errorMsg.classList.add('show');
                loginBtn.disabled = false;
                loginBtn.textContent = 'Iniciar Sesión';
            }
        });
    </script>
</body>
</html>
