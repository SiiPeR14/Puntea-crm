<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Puntea - Iniciar sesión</title>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>

<style>
* {
margin: 0;
padding: 0;
box-sizing: border-box;
}

body {
font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
min-height: 100vh;
display: flex;
align-items: center;
justify-content: center;
padding: 20px;
}

.login-container {
width: 100%;
max-width: 400px;
text-align: center;
}

.logo {
margin-bottom: 30px;
}

.logo svg {
width: 120px;
height: 120px;
}

.brand-name {
color: white;
font-size: 32px;
font-weight: 700;
margin-top: 20px;
margin-bottom: 8px;
}

.tagline {
color: #94a3b8;
font-size: 16px;
margin-bottom: 40px;
}

.form-group {
margin-bottom: 20px;
position: relative;
}

.input-icon {
position: absolute;
left: 16px;
top: 50%;
transform: translateY(-50%);
color: #64748b;
font-size: 18px;
}

.form-input {
width: 100%;
padding: 16px 16px 16px 48px;
background: rgba(255, 255, 255, 0.05);
border: 1px solid rgba(255, 255, 255, 0.1);
border-radius: 12px;
color: white;
font-size: 16px;
transition: all 0.3s ease;
}

.form-input:focus {
outline: none;
border-color: #2dd4bf;
background: rgba(255, 255, 255, 0.08);
}

.form-input::placeholder {
color: #64748b;
}

.password-toggle {
position: absolute;
right: 16px;
top: 50%;
transform: translateY(-50%);
color: #64748b;
cursor: pointer;
background: none;
border: none;
font-size: 16px;
}

.forgot-password {
text-align: right;
margin-bottom: 24px;
}

.forgot-password a {
color: #2dd4bf;
text-decoration: none;
font-size: 14px;
}

.forgot-password a:hover {
text-decoration: underline;
}

.login-button {
width: 100%;
padding: 16px;
background: #2dd4bf;
color: #0f172a;
border: none;
border-radius: 12px;
font-size: 16px;
font-weight: 600;
cursor: pointer;
transition: all 0.3s ease;
}

.login-button:hover {
background: #14b8a6;
transform: translateY(-2px);
}

.login-button:active {
transform: translateY(0);
}

.divider {
margin: 24px 0;
text-align: center;
position: relative;
}

.divider::before {
content: '';
position: absolute;
left: 0;
top: 50%;
width: 45%;
height: 1px;
background: rgba(255, 255, 255, 0.1);
}

.divider::after {
content: '';
position: absolute;
right: 0;
top: 50%;
width: 45%;
height: 1px;
background: rgba(255, 255, 255, 0.1);
}

.divider-text {
color: #64748b;
font-size: 14px;
}

.legal-text {
color: #64748b;
font-size: 12px;
margin-top: 24px;
line-height: 1.5;
}

.legal-text a {
color: #2dd4bf;
text-decoration: none;
}

.legal-text a:hover {
text-decoration: underline;
}

.error-message {
background: rgba(239, 68, 68, 0.1);
border: 1px solid rgba(239, 68, 68, 0.3);
color: #fca5a5;
padding: 12px;
border-radius: 8px;
margin-bottom: 20px;
font-size: 14px;
display: none;
}

.loading {
opacity: 0.6;
pointer-events: none;
}

/* Iconos SVG */
.icon-user, .icon-lock, .icon-eye {
width: 20px;
height: 20px;
}
</style>
</head>
<body>
<div class="login-container">
<!-- Logo -->
<div class="logo">
<!-- AQUÍ VA VUESTRO LOGO -->
<!-- Si tenéis el logo en SVG, reemplaza esto -->
<svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
<rect width="100" height="100" rx="20" fill="#0f172a"/>
<path d="M30 70 Q50 70 50 50 Q50 30 70 30 Q90 30 90 50 Q90 70 70 70"
stroke="white" stroke-width="8" stroke-linecap="round"/>
<path d="M35 65 L55 45" stroke="#2dd4bf" stroke-width="6" stroke-linecap="round"/>
<circle cx="65" cy="45" r="8" fill="#2dd4bf"/>
</svg>
</div>

<h1 class="brand-name">Puntea</h1>
<p class="tagline">Conecta, puntúa, mejora.</p>

<!-- Mensaje de error -->
<div class="error-message" id="errorMessage"></div>

<!-- Formulario -->
<form id="loginForm">
<div class="form-group">
<span class="input-icon">
<svg class="icon-user" fill="none" stroke="currentColor" viewBox="0 0 24 24">
<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
</svg>
</span>
<input type="email"
class="form-input"
id="email"
placeholder="Correo electrónico"
required
autocomplete="email">
</div>

<div class="form-group">
<span class="input-icon">
<svg class="icon-lock" fill="none" stroke="currentColor" viewBox="0 0 24 24">
<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/>
</svg>
</span>
<input type="password"
class="form-input"
id="password"
placeholder="Contraseña"
required
autocomplete="current-password">
<button type="button" class="password-toggle" id="togglePassword">
<svg class="icon-eye" fill="none" stroke="currentColor" viewBox="0 0 24 24">
<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>
</svg>
</button>
</div>

<div class="forgot-password">
<a href="#" id="forgotPassword">¿Has olvidado tu contraseña?</a>
</div>

<button type="submit" class="login-button" id="loginButton">
Iniciar sesión
</button>
</form>

<div class="divider">
<span class="divider-text">o continúa con</span>
</div>

<p class="legal-text">
Al iniciar sesión aceptas nuestros<br>
<a href="#">Términos y Condiciones</a> y nuestra <a href="#">Política de Privacidad</a>
</p>
</div>

<script>
// ==========================================
// CONFIGURACIÓN DE FIREBASE
// ==========================================
// ESTO LO RELLENARÁS CON TUS DATOS DE FIREBASE
const firebaseConfig = {
apiKey: "TU_API_KEY_AQUI",
authDomain: "puntea-xxxxx.firebaseapp.com",
projectId: "puntea",
storageBucket: "puntea-xxxxx.appspot.com",
messagingSenderId: "123456789",
appId: "1:123456789:web:abcdef123456"
};

// Inicializar Firebase
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();

// ==========================================
// FUNCIONALIDAD DEL LOGIN
// ==========================================

// Mostrar/ocultar contraseña
const togglePassword = document.getElementById('togglePassword');
const passwordInput = document.getElementById('password');

togglePassword.addEventListener('click', function() {
const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
passwordInput.setAttribute('type', type);
});

// Login
const loginForm = document.getElementById('loginForm');
const errorMessage = document.getElementById('errorMessage');
const loginButton = document.getElementById('loginButton');

loginForm.addEventListener('submit', async function(e) {
e.preventDefault();

const email = document.getElementById('email').value;
const password = document.getElementById('password').value;

// Mostrar estado de carga
loginButton.classList.add('loading');
loginButton.textContent = 'Iniciando sesión...';
errorMessage.style.display = 'none';

try {
// Intentar login con Firebase
await auth.signInWithEmailAndPassword(email, password);

// Si todo va bien, redirigir al dashboard
window.location.href = 'index.html';

} catch (error) {
// Si hay error, mostrarlo
errorMessage.textContent = getErrorMessage(error.code);
errorMessage.style.display = 'block';
loginButton.classList.remove('loading');
loginButton.textContent = 'Iniciar sesión';
}
});

// Recuperar contraseña
document.getElementById('forgotPassword').addEventListener('click', async function(e) {
e.preventDefault();

const email = document.getElementById('email').value;

if (!email) {
errorMessage.textContent = 'Por favor, introduce tu email primero';
errorMessage.style.display = 'block';
return;
}

try {
await auth.sendPasswordResetEmail(email);
alert('Te hemos enviado un email para restablecer tu contraseña');
} catch (error) {
errorMessage.textContent = 'Error al enviar el email. Verifica que el email es correcto.';
errorMessage.style.display = 'block';
}
});

// Función para traducir errores
function getErrorMessage(errorCode) {
switch(errorCode) {
case 'auth/user-not-found':
return 'No existe ninguna cuenta con este email';
case 'auth/wrong-password':
return 'Contraseña incorrecta';
case 'auth/invalid-email':
return 'El email no es válido';
case 'auth/user-disabled':
return 'Esta cuenta ha sido desactivada';
case 'auth/too-many-requests':
return 'Demasiados intentos. Intenta más tarde';
default:
return 'Error al iniciar sesión. Verifica tus credenciales';
}
}
</script>
</body>
</html>
